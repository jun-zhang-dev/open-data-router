# 唯一真相：每条源一个 [[source]]。ROUTER.md 由 verify.py 从这里 + 探针结果生成，勿手改 ROUTER.md。
#
# 字段
#   id      唯一短名
#   cat     路由分类（见 verify.py CATS 顺序）
#   kind    hf = HuggingFace 数据集 | gh = GitHub 仓库 | web = 其他站点/API
#   ref     hf/gh: owner/name；web: 探针 URL（必须是机器可判定的端点，不是首页营销页）
#   expect  web 可选：响应体必须包含的子串（证明端点真的返回数据，而不是 200 的错误页）
#   frozen  true = 有意冻结的快照（不按"久未更新"降级）
#   live_days  源头声称持续更新时填：超过这么多天未更新 → ⚠️（抓"号称实时、实际停更"）
#   use     什么时候来这里（路由句）
#   why     为什么算优质（信号来源）


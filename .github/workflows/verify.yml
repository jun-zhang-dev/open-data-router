name: verify

on:
  schedule:
    - cron: "17 3 * * 1" # 每周一 03:17 UTC
  workflow_dispatch:
  push:
    paths: ["sources.toml", "verify.py"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe all sources
        id: probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 verify.py
        continue-on-error: true
      - name: Commit refreshed router
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROUTER.md verified.jsonl
          git diff --cached --quiet || git commit -m "verify: refresh $(date -u +%F)"
          git push
      - name: Fail if any source is down
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::error::some sources failed; see ROUTER.md ❌ rows"
          exit 1
